<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login / Register — Pizza Palace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" href="/css/style.css"/>
  <style>
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); }
    .auth-card { width: 100%; max-width: 460px; margin: 2rem; }
    .auth-logo { text-align: center; margin-bottom: 2rem; color: var(--white); }
    .auth-logo i { font-size: 2.5rem; color: var(--red); display: block; margin-bottom: .5rem; }
    .auth-logo h2 { font-size: 1.6rem; font-weight: 800; }
    .auth-logo p  { font-size: .85rem; opacity: .5; margin-top: .3rem; }
    .auth-box { background: var(--card-bg); border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow-lg); }
    .auth-tabs { display: grid; grid-template-columns: 1fr 1fr; }
    .auth-tab {
      padding: 1rem; text-align: center; font-weight: 700; font-size: .9rem;
      background: var(--grey-1); color: var(--text-2); cursor: pointer; border: none;
      transition: var(--t);
    }
    .auth-tab.active { background: var(--white); color: var(--red); box-shadow: inset 0 -2px 0 var(--red); }
    [data-theme="dark"] .auth-tab.active { background: var(--card-bg); }
    .auth-form { padding: 2rem; display: none; }
    .auth-form.active { display: block; }
    .auth-divider { text-align: center; margin: 1.2rem 0; position: relative; color: var(--text-2); font-size: .8rem; }
    .auth-divider::before, .auth-divider::after { content:''; position: absolute; top: 50%; width: 42%; height: 1px; background: var(--border); }
    .auth-divider::before { left: 0; } .auth-divider::after { right: 0; }
    .google-btn { width: 100%; padding: .78rem; border: 1.5px solid var(--border); border-radius: var(--radius-sm); background: none; cursor: pointer; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: .7rem; font-size: .9rem; transition: var(--t); color: var(--text); }
    .google-btn:hover { border-color: var(--red); color: var(--red); }
    .pw-toggle { position: relative; }
    .pw-toggle .form-control { padding-right: 3rem; }
    .pw-eye { position: absolute; right: .9rem; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--grey-3); font-size: .95rem; }
    .pw-eye:hover { color: var(--red); }
    .role-select { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; }
    .role-opt { display: none; }
    .role-opt + label { display: flex; align-items: center; gap: .5rem; padding: .6rem .9rem; border: 1.5px solid var(--border); border-radius: var(--radius-sm); cursor: pointer; font-size: .82rem; font-weight: 600; transition: var(--t); }
    .role-opt:checked + label { border-color: var(--red); background: rgba(230,57,70,.07); color: var(--red); }
    .auth-footer { text-align: center; padding: 1.2rem 2rem; border-top: 1px solid var(--border); font-size: .84rem; color: var(--text-2); }
    .auth-footer a { color: var(--red); font-weight: 700; }
  </style>
</head>
<body>

<div class="auth-card">
  <div class="auth-logo">
    <i class="fas fa-pizza-slice"></i>
    <h2>Pizza Palace</h2>
    <p>Sign in to order, track, and manage</p>
  </div>

  <div class="auth-box">
    <div class="auth-tabs">
      <button class="auth-tab active" id="loginTab" onclick="switchTab('login')"><i class="fas fa-sign-in-alt"></i> Login</button>
      <button class="auth-tab" id="registerTab" onclick="switchTab('register')"><i class="fas fa-user-plus"></i> Register</button>
    </div>

    <!-- LOGIN FORM -->
    <form class="auth-form active" id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" class="form-control" id="loginEmail" placeholder="you@example.com" required autocomplete="email"/>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <div class="pw-toggle">
          <input type="password" class="form-control" id="loginPassword" placeholder="••••••••" required autocomplete="current-password"/>
          <button type="button" class="pw-eye" onclick="togglePw('loginPassword', this)"><i class="fas fa-eye"></i></button>
        </div>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.2rem">
        <label style="display:flex;align-items:center;gap:.4rem;font-size:.82rem;cursor:pointer">
          <input type="checkbox" style="accent-color:var(--red)"/> Remember me
        </label>
        <a href="#" style="font-size:.82rem;color:var(--red)">Forgot password?</a>
      </div>
      <button type="submit" class="btn btn-primary btn-full" id="loginBtn">
        <span id="loginBtnText"><i class="fas fa-sign-in-alt"></i> Login</span>
        <span id="loginSpinner" style="display:none"><i class="fas fa-spinner fa-spin"></i> Signing in...</span>
      </button>
      <div class="auth-divider">or continue with</div>
      <button type="button" class="google-btn" onclick="showToast('Google login not implemented in demo', 'info')">
        <i class="fab fa-google" style="color:#ea4335"></i> Continue with Google
      </button>
      <div style="background:var(--grey-1);border-radius:var(--radius-sm);padding:1rem;margin-top:1.2rem;font-size:.78rem;color:var(--text-2)">
        <strong>Demo accounts:</strong><br/>
        admin@pizza.com / admin123 · customer@pizza.com / customer123<br/>
        rider@pizza.com / rider123
      </div>
    </form>

    <!-- REGISTER FORM -->
    <form class="auth-form" id="registerForm" onsubmit="handleRegister(event)">
      <div class="form-group">
        <label class="form-label">Full Name</label>
        <input type="text" class="form-control" id="regName" placeholder="Your full name" required/>
      </div>
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" class="form-control" id="regEmail" placeholder="you@example.com" required autocomplete="email"/>
      </div>
      <div class="form-group">
        <label class="form-label">Phone Number</label>
        <input type="tel" class="form-control" id="regPhone" placeholder="+60 12-345 6789"/>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <div class="pw-toggle">
          <input type="password" class="form-control" id="regPassword" placeholder="Min. 6 characters" required autocomplete="new-password" minlength="6"/>
          <button type="button" class="pw-eye" onclick="togglePw('regPassword', this)"><i class="fas fa-eye"></i></button>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Confirm Password</label>
        <div class="pw-toggle">
          <input type="password" class="form-control" id="regConfirm" placeholder="Repeat password" required autocomplete="new-password"/>
          <button type="button" class="pw-eye" onclick="togglePw('regConfirm', this)"><i class="fas fa-eye"></i></button>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Account Type</label>
        <div class="role-select">
          <input class="role-opt" type="radio" name="role" id="roleCustomer" value="customer" checked/>
          <label for="roleCustomer"><i class="fas fa-user" style="color:var(--red)"></i> Customer</label>
          <input class="role-opt" type="radio" name="role" id="roleRider" value="rider"/>
          <label for="roleRider"><i class="fas fa-motorcycle" style="color:var(--orange)"></i> Rider</label>
        </div>
      </div>
      <label style="display:flex;align-items:flex-start;gap:.5rem;font-size:.82rem;color:var(--text-2);margin-bottom:1.2rem;cursor:pointer">
        <input type="checkbox" required style="accent-color:var(--red);margin-top:2px"/> 
        I agree to the <a href="#" style="color:var(--red)">Terms of Service</a> and <a href="#" style="color:var(--red)">Privacy Policy</a>
      </label>
      <button type="submit" class="btn btn-primary btn-full" id="registerBtn">
        <span id="registerBtnText"><i class="fas fa-user-plus"></i> Create Account</span>
        <span id="registerSpinner" style="display:none"><i class="fas fa-spinner fa-spin"></i> Creating...</span>
      </button>
    </form>

    <div class="auth-footer">
      <a href="/">← Back to Home</a>
    </div>
  </div>
</div>

<div id="toast-container"></div>
<script src="/js/app.js"></script>
<script>
  // Already logged in? redirect
  if (Auth.isLoggedIn()) {
    const user = Auth.getUser();
    if (user?.role === 'admin')  window.location.href = '/admin/dashboard.html';
    else if (user?.role === 'rider') window.location.href = '/rider/panel.html';
    else window.location.href = '/';
  }

  function switchTab(tab) {
    document.getElementById('loginForm').classList.toggle('active', tab === 'login');
    document.getElementById('registerForm').classList.toggle('active', tab === 'register');
    document.getElementById('loginTab').classList.toggle('active', tab === 'login');
    document.getElementById('registerTab').classList.toggle('active', tab === 'register');
  }

  function togglePw(id, btn) {
    const input = document.getElementById(id);
    const isText = input.type === 'text';
    input.type = isText ? 'password' : 'text';
    btn.innerHTML = `<i class="fas fa-eye${isText ? '' : '-slash'}"></i>`;
  }

  async function handleLogin(e) {
    e.preventDefault();
    const email    = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;

    document.getElementById('loginBtnText').style.display    = 'none';
    document.getElementById('loginSpinner').style.display    = 'inline-flex';
    document.getElementById('loginBtn').disabled             = true;

    try {
      const data = await apiCall('POST', '/auth/login', { email, password });
      if (data.success) {
        Auth.setSession(data.token, data.user);
        showToast(`Welcome back, ${data.user.name.split(' ')[0]}! 🍕`, 'success');
        setTimeout(() => {
          if (data.user.role === 'admin')       window.location.href = '/admin/dashboard.html';
          else if (data.user.role === 'rider')  window.location.href = '/rider/panel.html';
          else window.location.href = '/';
        }, 1000);
      } else {
        showToast(data.message || 'Invalid email or password', 'error');
      }
    } catch (err) {
      showToast('Server error. Please try again.', 'error');
    } finally {
      document.getElementById('loginBtnText').style.display = 'inline-flex';
      document.getElementById('loginSpinner').style.display = 'none';
      document.getElementById('loginBtn').disabled          = false;
    }
  }

  async function handleRegister(e) {
    e.preventDefault();
    const name     = document.getElementById('regName').value.trim();
    const email    = document.getElementById('regEmail').value.trim();
    const phone    = document.getElementById('regPhone').value.trim();
    const password = document.getElementById('regPassword').value;
    const confirm  = document.getElementById('regConfirm').value;
    const role     = document.querySelector('input[name="role"]:checked').value;

    if (password !== confirm) { showToast('Passwords do not match', 'error'); return; }

    document.getElementById('registerBtnText').style.display = 'none';
    document.getElementById('registerSpinner').style.display = 'inline-flex';
    document.getElementById('registerBtn').disabled          = true;

    try {
      const data = await apiCall('POST', '/auth/register', { name, email, phone, password, role });
      if (data.success) {
        Auth.setSession(data.token, data.user);
        showToast(`Account created! Welcome, ${name.split(' ')[0]}! 🎉`, 'success');
        setTimeout(() => {
          if (data.user.role === 'rider') window.location.href = '/rider/panel.html';
          else window.location.href = '/';
        }, 1200);
      } else {
        showToast(data.message || 'Registration failed', 'error');
      }
    } catch (err) {
      showToast('Server error. Please try again.', 'error');
    } finally {
      document.getElementById('registerBtnText').style.display = 'inline-flex';
      document.getElementById('registerSpinner').style.display = 'none';
      document.getElementById('registerBtn').disabled          = false;
    }
  }
</script>
</body>
</html>
